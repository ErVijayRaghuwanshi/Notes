title: Notes
description: SDE2 Interview Preparation - Technical Knowledge Base
url: https://ervijayraghuwanshi.github.io
baseurl: /Notes

markdown: kramdown

kramdown:
  input: GFM
  hard_wrap: false

# Exclude files from Jekyll processing
exclude:
  - node_modules
  - vendor
  - Makefile.archived
  - "*.py"
  - "06-specialized-topics/tools"

# Disable Liquid processing globally for all markdown files
# This prevents Jekyll from interpreting {{ }} and {% %} as Liquid tags
# Required because DevOps notes contain Ansible/Jinja2 template examples
defaults:
  - scope:
      path: ""
    values:
      render_with_liquid: false