        }

            display: none;
        }

            display: block;
        }
        
        .tree-toggle {
            transition: transform 0.2s ease;
        }
        
        .tree-folder.open > .tree-header .tree-toggle {
            transform: rotate(90deg);
        }
        
        .markdown-body {
            line-height: 1.7;

        .markdown-body h1 {

            font-weight: 600;
            margin-top: 1.25rem;
            margin-bottom: 0.5rem;
            color: #93c5fd;
        }

            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }
        
        .markdown-body p {
            margin-bottom: 1rem;
        }
        
        .markdown-body ul, .markdown-body ol {
            margin-bottom: 1rem;
            padding-left: 1.5rem;
        }
        
        .markdown-body li {
            margin-bottom: 0.25rem;
        }
        
        .markdown-body code:not([class*="language-"]) {
            background-color: #374151;
            padding: 0.125rem 0.375rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
            color: #fbbf24;
        }
        
        .markdown-body pre {
            margin-bottom: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
        }
        
        .markdown-body pre code {
            background: none;
            padding: 0;
            color: inherit;
        }
        
        .markdown-body table {
            width: 100%;
            margin-bottom: 1rem;
            border-collapse: collapse;
        }
        
        .markdown-body th, .markdown-body td {
            border: 1px solid #374151;
            padding: 0.5rem 0.75rem;
            text-align: left;
        }
        
        .markdown-body th {
            background-color: #1f2937;
            font-weight: 600;
        }
        
        .markdown-body blockquote {
            border-left: 4px solid #3b82f6;
            padding-left: 1rem;
            margin: 1rem 0;
            color: #9ca3af;
            font-style: italic;
        }
        
        .markdown-body a {
            color: #60a5fa;
            text-decoration: underline;
        }
        
        .markdown-body a:hover {
            color: #93c5fd;
        }
        
        .markdown-body hr {
            border: none;
            border-top: 1px solid #374151;
            margin: 2rem 0;
        }
        
        .search-highlight {
            background-color: #fbbf24;
            color: #1f2937;
            padding: 0 2px;
            border-radius: 2px;
        }
        
        .search-result {
            cursor: pointer;
            transition: all 0.15s ease;

                        { name: 'README.md', type: 'file', path: 'interview-prep/genesys/README.md' },
                        { name: '01-role-overview.md', type: 'file', path: 'interview-prep/genesys/01-role-overview.md' },
                        { name: '02-conversational-ai.md', type: 'file', path: 'interview-prep/genesys/02-conversational-ai.md' },
                        { name: '03-llm-rag-systems.md', type: 'file', path: 'interview-prep/genesys/03-llm-rag-systems.md' },
                        { name: '04-agentic-ai.md', type: 'file', path: 'interview-prep/genesys/04-agentic-ai.md' },
                        { name: '05-mlops-aws.md', type: 'file', path: 'interview-prep/genesys/05-mlops-aws.md' },
                        { name: '06-system-design.md', type: 'file', path: 'interview-prep/genesys/06-system-design.md' },
                        { name: '07-coding-focus.md', type: 'file', path: 'interview-prep/genesys/07-coding-focus.md' },
                        { name: '08-behavioral.md', type: 'file', path: 'interview-prep/genesys/08-behavioral.md' },
                        { name: '09-qa-bank.md', type: 'file', path: 'interview-prep/genesys/09-qa-bank.md' },
                        { name: '10-final-revision.md', type: 'file', path: 'interview-prep/genesys/10-final-revision.md' }
                    ]}
                ]
            },
            { name: 'README.md', type: 'file', path: 'README.md' },
            { name: 'NOTES_TEMPLATE.md', type: 'file', path: 'NOTES_TEMPLATE.md' },
            { name: 'RESTRUCTURING_SUMMARY.md', type: 'file', path: 'RESTRUCTURING_SUMMARY.md' }
        ]
    };

    // State
    let currentPath = 'README.md';
    let allFiles = [];
    let fileContents = {};

    // DOM Elements
    const fileTreeEl = document.getElementById('fileTree');
    const contentArea = document.getElementById('contentArea');
    const breadcrumb = document.getElementById('breadcrumb');
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const sidebar = document.getElementById('sidebar');
    const menuBtn = document.getElementById('menuBtn');
    const overlay = document.getElementById('overlay');

    // Flatten file tree for search
    function flattenTree(node, path = '') {
        const results = [];
        if (node.type === 'file' || node.type === 'html') {
            results.push({
                name: node.name,
                path: node.path,
                type: node.type,
                fullPath: path + node.name
            });
        }
        if (node.children) {
            for (const child of node.children) {
                results.push(...flattenTree(child, path + node.name + '/'));
            }
        }
        return results;
    }

    // Render file tree
    function renderTree(node, depth = 0) {
        if (node.type === 'file' || node.type === 'html') {
            const icon = node.type === 'html' ? '🌐' : '📄';
            return `
                <div class="tree-item py-1 px-2 rounded flex items-center gap-2" 
                     data-path="${node.path}" 
                     data-type="${node.type}"
                     style="padding-left: ${depth * 12 + 8}px">
                    <span class="text-xs">${icon}</span>
                    <span class="truncate">${node.name}</span>
                </div>
            `;
        }
        
        if (node.type === 'folder') {
            const isRoot = depth === 0;
            return `
                <div class="tree-folder ${isRoot ? 'open' : ''}">
                    <div class="tree-header tree-item py-1 px-2 rounded flex items-center gap-2" 
                         style="padding-left: ${depth * 12 + 8}px">
                        <span class="tree-toggle text-xs text-gray-400">▶</span>
                        <span class="text-xs">📁</span>
                        <span class="font-medium truncate">${node.name}</span>
                    </div>
                    <div class="tree-children pl-0">
                        ${node.children ? node.children.map(child => renderTree(child, depth + 1)).join('') : ''}
                    </div>
                </div>
            `;
        }
        
        return '';
    }

    // Load markdown content
    async function loadContent(path, type = 'file') {
        contentArea.innerHTML = `
            <div class="text-center py-12">
                <div class="loading-spinner mx-auto"></div>
                <p class="text-gray-400 mt-4">Loading ${path}...</p>
            </div>
        `;

        try {
            if (type === 'html') {
                // For HTML files, open in new tab or iframe
                contentArea.innerHTML = `
                    <div class="text-center py-12">
                        <h2 class="text-2xl font-bold mb-4">📊 Interactive Visualization</h2>
                        <p class="text-gray-400 mb-6">${path}</p>
                        <a href="${path}" target="_blank" 
                           class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded-lg font-medium transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                            </svg>
                            Open Visualization
                        </a>
                        <div class="mt-8 border border-gray-700 rounded-lg overflow-hidden">
                            <iframe src="${path}" class="w-full h-[600px]" frameborder="0"></iframe>
                        </div>
                    </div>
                `;
                updateBreadcrumb(path);
                return;
            }

            const response = await fetch(path);
            if (!response.ok) throw new Error(`Failed to load ${path}`);
            
            const markdown = await response.text();
            fileContents[path] = markdown;
            
            // Configure marked
            marked.setOptions({
                highlight: function(code, lang) {
                    if (Prism.languages[lang]) {
                        return Prism.highlight(code, Prism.languages[lang], lang);
                    }
                    return code;
                },
                breaks: true,
                gfm: true
            });
            
            contentArea.innerHTML = marked.parse(markdown);
            
            // Fix relative links in markdown
            contentArea.querySelectorAll('a').forEach(link => {
                const href = link.getAttribute('href');
                if (href && !href.startsWith('http') && !href.startsWith('#')) {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        const basePath = path.substring(0, path.lastIndexOf('/') + 1);
                        let newPath = basePath + href;
                        // Normalize path
                        newPath = newPath.replace(/\/\.\//g, '/').replace(/[^/]+\/\.\.\//g, '');
                        loadContent(newPath);
                        highlightActiveFile(newPath);
                    });
                }
            });
            
            updateBreadcrumb(path);
            currentPath = path;
            
            // Scroll to top
            window.scrollTo(0, 0);
            
        } catch (error) {
            contentArea.innerHTML = `
                <div class="text-center py-12">
                    <div class="text-6xl mb-4">😕</div>
                    <h2 class="text-2xl font-bold mb-2">Failed to load content</h2>
                    <p class="text-gray-400 mb-4">${path}</p>
                    <p class="text-red-400 text-sm">${error.message}</p>
                    <button onclick="loadContent('README.md')" 
                            class="mt-6 bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg">
                        Go to Home
                    </button>
                </div>
            `;
        }
    }

    // Update breadcrumb
    function updateBreadcrumb(path) {
        const parts = path.split('/');
        let html = '<span class="breadcrumb-item cursor-pointer hover:text-blue-400" onclick="loadContent(\'README.md\')">Home</span>';
        
        let currentPath = '';
        parts.forEach((part, index) => {
            currentPath += (index > 0 ? '/' : '') + part;
            const isLast = index === parts.length - 1;
            
            if (isLast) {
                html += `<span class="breadcrumb-item text-gray-200">${part}</span>`;
            } else {
                html += `<span class="breadcrumb-item cursor-pointer hover:text-blue-400">${part}</span>`;
            }
        });
        
        breadcrumb.innerHTML = html;
    }

    // Highlight active file in tree
    function highlightActiveFile(path) {
        document.querySelectorAll('.tree-item').forEach(item => {
            item.classList.remove('active');
            if (item.dataset.path === path) {
                item.classList.add('active');
                // Expand parent folders
                let parent = item.parentElement;
                while (parent) {
                    if (parent.classList.contains('tree-folder')) {
                        parent.classList.add('open');
                    }
                    parent = parent.parentElement;
                }
            }
        });
    }

    // Search functionality
    function performSearch(query) {
        if (!query.trim()) {
            searchResults.classList.add('hidden');
            return;
        }
        
        const lowerQuery = query.toLowerCase();
        const results = allFiles.filter(file => 
            file.name.toLowerCase().includes(lowerQuery) ||
            file.path.toLowerCase().includes(lowerQuery)
        ).slice(0, 10);
        
        if (results.length === 0) {
            searchResults.innerHTML = `
                <div class="p-3 text-gray-400 text-center">
                    No results found for "${query}"
                </div>
            `;
        } else {
            searchResults.innerHTML = results.map(file => `
                <div class="search-result p-2 border-b border-gray-700 last:border-0" 
                     data-path="${file.path}" data-type="${file.type}">
                    <div class="font-medium text-sm">${highlightMatch(file.name, query)}</div>
                    <div class="text-xs text-gray-500 truncate">${file.path}</div>
                </div>
            `).join('');
        }
        
        searchResults.classList.remove('hidden');
    }

    // Highlight search match
    function highlightMatch(text, query) {
        const regex = new RegExp(`(${query})`, 'gi');
        return text.replace(regex, '<span class="search-highlight">$1</span>');
    }

    // Initialize
    function init() {
        // Flatten tree for search
        allFiles = flattenTree(fileTree);
        
        // Render file tree
        fileTreeEl.innerHTML = fileTree.children.map(child => renderTree(child, 0)).join('');
        
        // File tree click handlers
        fileTreeEl.addEventListener('click', (e) => {
            const item = e.target.closest('.tree-item');
            if (!item) return;
            
            // Check if it's a folder header
            if (item.classList.contains('tree-header')) {
                const folder = item.closest('.tree-folder');
                folder.classList.toggle('open');
                return;
            }
            
            // It's a file
            const path = item.dataset.path;
            const type = item.dataset.type;
            if (path) {
                loadContent(path, type);
                highlightActiveFile(path);
                // Close mobile sidebar
                sidebar.classList.remove('open');
                overlay.classList.add('hidden');
            }
        });
        
        // Search handlers
        searchInput.addEventListener('input', (e) => {
            performSearch(e.target.value);
        });
        
        searchInput.addEventListener('focus', () => {
            if (searchInput.value.trim()) {
                searchResults.classList.remove('hidden');
            }
        });
        
        searchResults.addEventListener('click', (e) => {
            const result = e.target.closest('.search-result');
            if (result) {
                const path = result.dataset.path;
                const type = result.dataset.type;
                loadContent(path, type);
                highlightActiveFile(path);
                searchInput.value = '';
                searchResults.classList.add('hidden');
                sidebar.classList.remove('open');
                overlay.classList.add('hidden');
            }
        });
        
        // Close search results when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#searchInput') && !e.target.closest('#searchResults')) {
                searchResults.classList.add('hidden');
            }
        });
        
        // Keyboard shortcut for search
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                searchInput.focus();
            }
            if (e.key === 'Escape') {
                searchResults.classList.add('hidden');
                searchInput.blur();
            }
        });
        
        // Mobile menu
        menuBtn.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('hidden');
        });
        
        overlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            overlay.classList.add('hidden');
        });
        
        // Load initial content
        loadContent('README.md');
        highlightActiveFile('README.md');
    }

    // Start
    init();
    </script>
